<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InvenTrack</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #EFF6FF 0%, #F8FAFC 50%, #F0FDF4 100%);
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .splash-logo {
        width: 72px; height: 72px; border-radius: 20px;
        background: linear-gradient(135deg, #2563EB, #7C3AED);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 32px rgba(37, 99, 235, 0.3);
        margin-bottom: 24px;
        animation: splashPulse 2s ease-in-out infinite;
      }
      .splash-logo svg { width: 40px; height: 40px; color: white; }
      .splash-title {
        font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
        background: linear-gradient(135deg, #2563EB, #7C3AED);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        background-clip: text; margin-bottom: 8px;
      }
      .splash-subtitle { font-size: 14px; color: #64748B; margin-bottom: 32px; }
      .splash-spinner {
        width: 40px; height: 40px; border: 3px solid #E2E8F0;
        border-top-color: #2563EB; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .splash-dots { display: flex; gap: 6px; margin-top: 24px; }
      .splash-dots span {
        width: 8px; height: 8px; border-radius: 50%; background: #CBD5E1;
        animation: dotPulse 1.4s ease-in-out infinite;
      }
      .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes splashPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
      @keyframes dotPulse { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
      </div>
      <h1 class="splash-title">InvenTrack</h1>
      <p class="splash-subtitle">Sistema de Trazabilidad con Visión Artificial</p>
      <div class="splash-spinner"></div>
      <div class="splash-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('splash');
          if (splash) splash.classList.add('hidden');
          setTimeout(function() { if (splash) splash.remove(); }, 600);
        }, 1500);
      });
    </script>
  </body>
</html>
